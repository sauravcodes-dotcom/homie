# Local Postgres with the pgvector extension preinstalled.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie
      POSTGRES_DB: homie
    ports:
      - "5432:5432"
    volumes:
      - homie-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie"]
      interval: 5s
      retries: 10

volumes:
  homie-db:
